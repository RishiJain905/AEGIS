[project]
name = "aegis-api"
version = "1.0.0"
description = "AEGIS FastAPI application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "aegis-persistence",
    "aegis-event-streaming",
    "aegis-simulation",
    "aegis-ml",
    "aegis-incidents",
    "aegis-agents",
    "aegis-policy",
    "aegis-reports",
    "aegis-replay",
    "aegis-scoring",
    "aegis-observability",
    "alembic>=1.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "argon2-cffi>=23.1.0",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-persistence = { workspace = true }
aegis-event-streaming = { workspace = true }
aegis-simulation = { workspace = true }
aegis-ml = { workspace = true }
aegis-incidents = { workspace = true }
aegis-agents = { workspace = true }
aegis-policy = { workspace = true }
aegis-reports = { workspace = true }
aegis-replay = { workspace = true }
aegis-scoring = { workspace = true }
aegis-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_api"]

[project.scripts]
aegis-api = "aegis_api.main:run"
