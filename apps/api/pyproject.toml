[project]
name = "aegis-api"
version = "0.0.0"
description = "AEGIS FastAPI application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_api"]

[project.scripts]
aegis-api = "aegis_api.main:run"
