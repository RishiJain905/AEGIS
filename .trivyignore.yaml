# AEGIS Trivy image-scan exception file (approved, time-bounded).
#
# Governs the `Local image scan and SBOM` gate in .github/workflows/security.yml
# (trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL).
#
# Every entry below is an approved exception record under
# docs/security/scan-triage-policy.md ("Exception record contract"). All 11 CVEs
# are fixable HIGH findings in TRANSITIVE Node tooling packages (glob, minimatch,
# sigstore, tar) that ship inside the aegis web image via the npm/pnpm toolchain,
# not the application's own dependency graph. They are not reachable from AEGIS
# runtime code paths (build-time archive/glob/signature tooling only).
#
# Compensating controls: images are never published (local build + scan only);
# the web container runs as a non-root user with a read-only app tree; no
# untrusted archive extraction or glob expansion occurs on request paths.
#
# Remediation: tracked in the `security-scan` issue for a base-image/toolchain
# refresh that pulls fixed glob>=10.5.0, minimatch>=9.0.6, sigstore>=4.1.1,
# tar>=7.5.11. On `expired_at` the gate fails again until fixed or re-approved.
#
# EXPIRY: 2026-08-18 (30 calendar days, the policy maximum). Extensions are new
# approvals, not silent date edits. NEW HIGH/CRITICAL findings are NOT covered by
# this file and will still fail the gate.
