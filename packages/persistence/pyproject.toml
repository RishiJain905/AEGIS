[project]
name = "aegis-persistence"
version = "1.0.0"
description = "AEGIS PostgreSQL persistence layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.15",
    "greenlet>=3.1",
    "boto3>=1.35",
    # Fernet, for the provider API keys this layer stores on an operator's behalf.
    "cryptography>=44.0",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_persistence"]

[project.scripts]
aegis-seed = "aegis_persistence.seed:main"
