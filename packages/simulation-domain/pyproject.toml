[project]
name = "aegis-simulation-domain"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "aegis-scenario-sdk",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-scenario-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_simulation_domain"]
