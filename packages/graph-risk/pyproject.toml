[project]
name = "aegis-graph-risk"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["aegis-contracts"]

[tool.uv.sources]
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_graph_risk"]
artifacts = ["src/aegis_graph_risk/py.typed"]
