[project]
name = "aegis-scenario-sdk"
version = "0.0.0"
description = "AEGIS declarative scenario authoring, validation, and publication SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "packaging>=24.2",
    "pyyaml>=6.0.2",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_scenario_sdk"]

[project.scripts]
aegis-scenario = "aegis_scenario_sdk.cli:main"
