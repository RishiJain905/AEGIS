[project]
name = "aegis-event-streaming"
version = "1.0.0"
description = "AEGIS event streaming — outbox relay, Redis Streams, idempotent consumers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "aegis-persistence",
    "redis[hiredis]>=5.2",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_event_streaming"]
artifacts = ["src/aegis_event_streaming/py.typed"]
