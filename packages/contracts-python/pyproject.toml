[project]
name = "aegis-contracts"
version = "0.0.0"
description = "AEGIS shared Python contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_contracts"]
artifacts = ["src/aegis_contracts/py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
