[project]
name = "aegis-model-provider"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
openai = ["openai>=1.68"]

[tool.uv.sources]
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_model_provider"]
artifacts = ["src/aegis_model_provider/py.typed"]
