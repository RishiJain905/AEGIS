    config:
      failureRate: 0.1
      successRate: 0.9
- id: evt-effect-credentials-status
  simTime: '2026-01-01T00:15:00.000Z'
  priority: 3
  tieBreaker: 0
  targetAssetId: asset:identity-svc-logistics-bot
  branchGate:
    branchGroup: root-cause
    branchId: branch-cause-credentials
  action:
