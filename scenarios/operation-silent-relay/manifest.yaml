generators:
- id: gen-baseline-auth
  targetAssetId: asset:svc-identity-broker
  plugin:
    pluginId: telemetry.auth_attempt
    config:
      failureRate: 0.03
      successRate: 0.97
  schedule:
    intervalSimSeconds: 20
    jitterSimSeconds: 2
- id: gen-baseline-api-logistics
  targetAssetId: asset:svc-logistics-api
  plugin:
    pluginId: telemetry.api_request
    config:
      requestsPerInterval: 25
      errorRate: 0.02
  schedule:
    intervalSimSeconds: 15
    jitterSimSeconds: 1
- id: gen-baseline-api-comms
  targetAssetId: asset:svc-comms-gateway
  plugin:
    pluginId: telemetry.api_request
    config:
      requestsPerInterval: 18
      errorRate: 0.02
  schedule:
    intervalSimSeconds: 18
    jitterSimSeconds: 1
- id: gen-baseline-db-audit
  targetAssetId: asset:database-audit-store
  plugin:
    pluginId: telemetry.database_query
    config:
      queriesPerInterval: 8
      anomalyRate: 0.01
  schedule:
    intervalSimSeconds: 25
    jitterSimSeconds: 2
- id: gen-baseline-db-pii
  targetAssetId: asset:database-customer-pii
  plugin:
    pluginId: telemetry.database_query
    config:
      queriesPerInterval: 6
      anomalyRate: 0.01
  schedule:
    intervalSimSeconds: 30
    jitterSimSeconds: 2
- id: gen-baseline-network-comms
  targetAssetId: asset:svc-comms-gateway
  plugin:
    pluginId: telemetry.network_flow
    config:
      bytesPerInterval: 2048
      protocol: tcp
  schedule:
    intervalSimSeconds: 12
    jitterSimSeconds: 1
- id: gen-baseline-deploy-cicd
  targetAssetId: asset:svc-cicd-pipeline
  plugin:
    pluginId: telemetry.deployment_event
    config:
      deploymentsPerInterval: 1
      failureRate: 0.02
  schedule:
    intervalSimSeconds: 60
    jitterSimSeconds: 5
- id: gen-baseline-health-logistics
  targetAssetId: asset:svc-logistics-api
  plugin:
    pluginId: telemetry.health_check
    config:
      healthyProbability: 0.97
  schedule:
    intervalSimSeconds: 20
    jitterSimSeconds: 1
- id: gen-baseline-health-comms
  targetAssetId: asset:svc-comms-gateway
  plugin:
    pluginId: telemetry.health_check
    config:
      healthyProbability: 0.96
  schedule:
    intervalSimSeconds: 20
    jitterSimSeconds: 1
- id: gen-baseline-process-analyst
  targetAssetId: asset:device-analyst-01
  plugin:
    pluginId: telemetry.process_activity
    config:
      eventsPerInterval: 12
      suspiciousRate: 0.02
  schedule:
    intervalSimSeconds: 22
    jitterSimSeconds: 2
- id: gen-baseline-process-jumphost
  targetAssetId: asset:device-ops-jumphost
  plugin:
    pluginId: telemetry.process_activity
    config:
      eventsPerInterval: 8
      suspiciousRate: 0.02
  schedule:
    intervalSimSeconds: 25
    jitterSimSeconds: 2
- id: gen-baseline-ai-inference
  targetAssetId: asset:svc-routing-inference-gateway
  plugin:
    pluginId: telemetry.ai_inference
    config:
      inferencesPerInterval: 10
      anomalyRate: 0.01
  schedule:
    intervalSimSeconds: 16
    jitterSimSeconds: 1
- id: gen-distractor-patch-auth
  targetAssetId: asset:svc-sso-broker
  plugin:
    pluginId: telemetry.auth_attempt
    config:
      failureRate: 0.08
      successRate: 0.92
  schedule:
    intervalSimSeconds: 45
    jitterSimSeconds: 3
- id: gen-distractor-ci-deploy
  targetAssetId: asset:svc-container-registry
  plugin:
    pluginId: telemetry.deployment_event
    config:
      deploymentsPerInterval: 1
      failureRate: 0.01
  schedule:
    intervalSimSeconds: 90
    jitterSimSeconds: 5
- id: gen-distractor-analytics-batch
  targetAssetId: asset:database-analytics-warehouse
  plugin:
    pluginId: telemetry.database_query
    config:
      queriesPerInterval: 15
      anomalyRate: 0.03
  schedule:
    intervalSimSeconds: 40
    jitterSimSeconds: 3
hiddenConditions:
- id: hidden-cause-compromised-credentials
  causeLabel: Compromised service account credentials
  triggerRefs:
  - evt-signal-credentials-auth
  - evt-signal-credentials-lateral
  effectRefs:
  - evt-effect-credentials-status
  visibility:
    mode: hidden_until_triggered
    revealAfterSimSeconds: 600
  triggerThreshold: 1
- id: hidden-cause-undocumented-maintenance
  causeLabel: Approved undocumented maintenance window
  triggerRefs:
  - evt-signal-maintenance-deploy
  - evt-signal-maintenance-health
  effectRefs:
  - evt-effect-maintenance-status
  visibility:
    mode: hidden_until_triggered
    revealAfterSimSeconds: 720
  triggerThreshold: 1
- id: hidden-cause-defective-deployment
  causeLabel: Defective container deployment release
  triggerRefs:
  - evt-signal-deployment-api
  - evt-signal-deployment-health
  effectRefs:
  - evt-effect-deployment-status
  visibility:
    mode: hidden_until_triggered
    revealAfterSimSeconds: 540
  triggerThreshold: 1
- id: hidden-cause-internal-misuse
  causeLabel: Internal privileged misuse and data exfiltration
  triggerRefs:
  - evt-signal-misuse-db
  - evt-signal-misuse-network
  effectRefs:
  - evt-effect-misuse-status
  visibility:
    mode: hidden_until_triggered
    revealAfterSimSeconds: 660
  triggerThreshold: 1
scheduledEvents:
- id: evt-select-root-cause
  simTime: '2026-01-01T00:00:00.000Z'
  priority: 0
  tieBreaker: 0
  action:
    pluginId: branch.seed_selector
    config:
      branchGroup: root-cause
- id: evt-select-response-path
  simTime: '2026-01-01T00:00:00.001Z'
  priority: 0
  tieBreaker: 1
  action:
    pluginId: branch.seed_selector
    config:
      branchGroup: response-path
- id: evt-signal-credentials-auth
  simTime: '2026-01-01T00:05:00.000Z'
  priority: 2
  tieBreaker: 0
  targetAssetId: asset:svc-identity-broker
  branchGate:
    branchGroup: root-cause
    branchId: branch-cause-credentials
  action:
    pluginId: telemetry.auth_attempt
