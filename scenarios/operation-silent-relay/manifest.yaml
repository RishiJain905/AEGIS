      failureRate: 0.4
- id: evt-signal-maintenance-health
  simTime: '2026-01-01T00:09:00.000Z'
  priority: 2
  tieBreaker: 0
  targetAssetId: asset:svc-comms-gateway
  branchGate:
    branchGroup: root-cause
    branchId: branch-cause-maintenance
  action:
    pluginId: telemetry.health_check
    config:
      healthyProbability: 0.35
- id: evt-effect-maintenance-status
  simTime: '2026-01-01T00:15:00.000Z'
  priority: 3
  tieBreaker: 0
  targetAssetId: asset:svc-comms-gateway
  branchGate:
    branchGroup: root-cause
    branchId: branch-cause-maintenance
  action:
    pluginId: effect.set_asset_status
    config:
      status: suspicious
- id: evt-signal-deployment-api
  simTime: '2026-01-01T00:07:00.000Z'
  priority: 2
  tieBreaker: 0
  targetAssetId: asset:svc-logistics-api
  branchGate:
    branchGroup: root-cause
    branchId: branch-cause-deployment
  action:
    pluginId: telemetry.api_request
    config:
      requestsPerInterval: 40
