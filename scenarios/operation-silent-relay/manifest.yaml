- id: evt-signal-maintenance-deploy
  simTime: '2026-01-01T00:06:00.000Z'
  priority: 2
  tieBreaker: 0
  targetAssetId: asset:svc-cicd-pipeline
  branchGate:
    branchGroup: root-cause
    branchId: branch-cause-maintenance
  action:
    pluginId: telemetry.deployment_event
