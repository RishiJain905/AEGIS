[project]
name = "aegis-incidents"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "aegis-graph-risk",
    "aegis-ml",
    "aegis-persistence",
    "aegis-simulation-domain",
    "pyyaml>=6.0",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-graph-risk = { workspace = true }
aegis-ml = { workspace = true }
aegis-persistence = { workspace = true }
aegis-simulation-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_incidents"]

[tool.hatch.build.targets.wheel.force-include]
"src/aegis_incidents/rules/config" = "aegis_incidents/rules/config"
