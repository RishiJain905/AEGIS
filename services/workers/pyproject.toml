[project]
name = "aegis-workers"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "aegis-persistence",
    "aegis-event-streaming",
    "aegis-agents",
    "aegis-replay",
    "redis[hiredis]>=5.2",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-persistence = { workspace = true }
aegis-event-streaming = { workspace = true }
aegis-agents = { workspace = true }
aegis-replay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_workers"]

[project.scripts]
aegis-worker = "aegis_workers.runner:main"
