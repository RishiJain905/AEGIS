[project]
name = "aegis-simulation"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aegis-contracts",
    "aegis-persistence",
    "aegis-scenario-sdk",
    "aegis-simulation-domain",
]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-persistence = { workspace = true }
aegis-scenario-sdk = { workspace = true }
aegis-simulation-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_simulation"]

[project.scripts]
aegis-simulator = "aegis_simulation.runner:main"
