# Application containers use a read-only root filesystem. Their only expected
# writable path is the bounded transient /tmp tmpfs declared below. Stateful
# and observability services retain their writable data volumes and defaults so
# the local development stack remains compatible with their upstream images.
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aegis}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aegis_dev_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      LOG_LEVEL: info
      # Fresh-install experience: real username/password auth. The dev-identity
      # picker (POST /auth/dev/login, GET /auth/dev/users) is OFF by default so a
      # new user gets the real sign-in + first-run "create admin" flow. Local devs
      # who want the picker can `export AEGIS_DEV_AUTH_ENABLED=true` before `up`.
      AEGIS_DEV_AUTH_ENABLED: ${AEGIS_DEV_AUTH_ENABLED:-false}
      AEGIS_WS_DEV_AUTH_ENABLED: ${AEGIS_WS_DEV_AUTH_ENABLED:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      # Simulation tick engine: the API process advances every RUNNING run on a cadence
      # and auto-completes it (STOP + after-action) at the sim-time horizon. See
      # .env.example for tuning notes.
      AEGIS_SIM_TICK_ENABLED: ${AEGIS_SIM_TICK_ENABLED:-true}
      AEGIS_SIM_TICK_INTERVAL_SECONDS: ${AEGIS_SIM_TICK_INTERVAL_SECONDS:-2.0}
      AEGIS_SIM_STEPS_PER_TICK: ${AEGIS_SIM_STEPS_PER_TICK:-4}
      AEGIS_SIM_MAX_SIM_SECONDS: ${AEGIS_SIM_MAX_SIM_SECONDS:-1500}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
      AEGIS_HEALTH_PROBE_TIMEOUT_MS: ${AEGIS_HEALTH_PROBE_TIMEOUT_MS:-2000}
      AEGIS_READY_REQUIRE_REDIS: ${AEGIS_READY_REQUIRE_REDIS:-true}
      AEGIS_READY_REQUIRE_OBJECT_STORAGE: ${AEGIS_READY_REQUIRE_OBJECT_STORAGE:-true}
      # Local LLM wiring. The AI copilot (Phase 3) is backed by a host-run
      # llama-server on :8086, reached from containers via host.docker.internal.
      # Default the app to the openai-compatible local provider so the copilot is
      # live; override AEGIS_PROVIDER_DEFAULT=mock to run fully offline. The Python
      # code default stays `mock` so CI/tests never need a model. (Alternative:
      # start the optional `llama` profile and override the URLs to http://llama:8086/v1.)
      AEGIS_PROVIDER_DEFAULT: ${AEGIS_PROVIDER_DEFAULT:-openai-compatible}
      AEGIS_PROVIDER_LOCAL_BASE_URL: http://host.docker.internal:8086/v1
      AEGIS_PROVIDER_LOCAL_MODEL: ${AEGIS_PROVIDER_LOCAL_MODEL:-Qwimi-3.6-27B-Q3_K_S.gguf}
      AEGIS_PROVIDER_EGRESS_ALLOWLIST: https://api.openai.com/v1,http://host.docker.internal:8086/v1,https://openrouter.ai/api/v1,https://ollama.com/v1
      # A local reasoning model can take tens of seconds per turn; give agent tasks
      # generous headroom (they still fail soft past this, shown in the chat).
      # Timeout budget chain — each layer must resolve before the one above it:
      # provider attempt ceiling (300s) < provider total budget (task timeout - 2s,
      # set per request) < agent task timeout (540s) < copilot client deadline (600s).
      # When the provider outlived the task deadline it was cancelled mid-flight and
      # the operator saw "Provider request was cancelled (PROVIDER_FAILURE)". Measured
      # on the local 27B reasoning model: ~76 tok/s prefill, ~27 tok/s generation, so
      # one real turn is 90-165s and a 3-round tool loop needs minutes.
      AEGIS_PROVIDER_TIMEOUT_SECONDS: ${AEGIS_PROVIDER_TIMEOUT_SECONDS:-300}
      AEGIS_PROVIDER_MAX_OUTPUT_TOKENS: ${AEGIS_PROVIDER_MAX_OUTPUT_TOKENS:-4096}
      AEGIS_AGENT_TASK_TIMEOUT_SECONDS: ${AEGIS_AGENT_TASK_TIMEOUT_SECONDS:-540}
      AEGIS_AGENT_TOOL_LOOP_MAX_ITERATIONS: ${AEGIS_AGENT_TOOL_LOOP_MAX_ITERATIONS:-3}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AEGIS_DATA_SOURCE: api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOSTNAME: '0.0.0.0'
      WEB_PORT: 3000
      NEXT_PUBLIC_AEGIS_DATA_SOURCE: api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/v1/realtime
      NEXT_PUBLIC_AEGIS_WS_TOKEN: ${NEXT_PUBLIC_AEGIS_WS_TOKEN:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      AEGIS_WORKER_MODE: outbox-relay
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
      # Local LLM wiring — matches the api service so worker-run agent tasks use
      # the same provider (see the api service note above).
      AEGIS_PROVIDER_DEFAULT: ${AEGIS_PROVIDER_DEFAULT:-openai-compatible}
      AEGIS_PROVIDER_LOCAL_BASE_URL: http://host.docker.internal:8086/v1
      AEGIS_PROVIDER_LOCAL_MODEL: ${AEGIS_PROVIDER_LOCAL_MODEL:-Qwimi-3.6-27B-Q3_K_S.gguf}
      AEGIS_PROVIDER_EGRESS_ALLOWLIST: https://api.openai.com/v1,http://host.docker.internal:8086/v1,https://openrouter.ai/api/v1,https://ollama.com/v1
      # Timeout budget chain — each layer must resolve before the one above it:
      # provider attempt ceiling (300s) < provider total budget (task timeout - 2s,
      # set per request) < agent task timeout (540s) < copilot client deadline (600s).
      # When the provider outlived the task deadline it was cancelled mid-flight and
      # the operator saw "Provider request was cancelled (PROVIDER_FAILURE)". Measured
      # on the local 27B reasoning model: ~76 tok/s prefill, ~27 tok/s generation, so
      # one real turn is 90-165s and a 3-round tool loop needs minutes.
      AEGIS_PROVIDER_TIMEOUT_SECONDS: ${AEGIS_PROVIDER_TIMEOUT_SECONDS:-300}
      AEGIS_PROVIDER_MAX_OUTPUT_TOKENS: ${AEGIS_PROVIDER_MAX_OUTPUT_TOKENS:-4096}
      AEGIS_AGENT_TASK_TIMEOUT_SECONDS: ${AEGIS_AGENT_TASK_TIMEOUT_SECONDS:-540}
      AEGIS_AGENT_TOOL_LOOP_MAX_ITERATIONS: ${AEGIS_AGENT_TOOL_LOOP_MAX_ITERATIONS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  agent-worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      AEGIS_ENV: development
      # Executes queued agent tasks — including autonomy-enqueued WATCHTOWER/ORACLE
      # triage — against the local model. Manual copilot tasks run inline in the API;
      # autonomy tasks are async and need this worker.
      AEGIS_WORKER_MODE: agent-runtime
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-agent-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
      AEGIS_PROVIDER_DEFAULT: ${AEGIS_PROVIDER_DEFAULT:-openai-compatible}
      AEGIS_PROVIDER_LOCAL_BASE_URL: http://host.docker.internal:8086/v1
      AEGIS_PROVIDER_LOCAL_MODEL: ${AEGIS_PROVIDER_LOCAL_MODEL:-Qwimi-3.6-27B-Q3_K_S.gguf}
      AEGIS_PROVIDER_EGRESS_ALLOWLIST: https://api.openai.com/v1,http://host.docker.internal:8086/v1,https://openrouter.ai/api/v1,https://ollama.com/v1
      # Timeout budget chain — each layer must resolve before the one above it:
      # provider attempt ceiling (300s) < provider total budget (task timeout - 2s,
      # set per request) < agent task timeout (540s) < copilot client deadline (600s).
      # When the provider outlived the task deadline it was cancelled mid-flight and
      # the operator saw "Provider request was cancelled (PROVIDER_FAILURE)". Measured
      # on the local 27B reasoning model: ~76 tok/s prefill, ~27 tok/s generation, so
      # one real turn is 90-165s and a 3-round tool loop needs minutes.
      AEGIS_PROVIDER_TIMEOUT_SECONDS: ${AEGIS_PROVIDER_TIMEOUT_SECONDS:-300}
      AEGIS_PROVIDER_MAX_OUTPUT_TOKENS: ${AEGIS_PROVIDER_MAX_OUTPUT_TOKENS:-4096}
      AEGIS_AGENT_TASK_TIMEOUT_SECONDS: ${AEGIS_AGENT_TASK_TIMEOUT_SECONDS:-540}
      AEGIS_AGENT_TOOL_LOOP_MAX_ITERATIONS: ${AEGIS_AGENT_TOOL_LOOP_MAX_ITERATIONS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  snapshot-worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      # Persists replay snapshot manifests on cadence + at terminal state. Without
      # this worker replay_snapshot_manifests stays empty and the replay projector
      # reconstructs from raw events only: placeholder nodes, no edges, and a full
      # event re-apply on every scrub. The worker existed but no deployment ran it.
      AEGIS_WORKER_MODE: snapshot
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-snapshot-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: services/simulation/Dockerfile
    command: ['aegis-simulator', 'service']
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-simulator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # OPTIONAL containerized llama.cpp llama-server (OpenAI-compatible API on :8086).
  # This is NOT the supported default: the documented local path is a host-run
  # llama-server binary on :8086 (see .env.example / docs/agents/model-providers.md),
  # which the api/worker reach at http://host.docker.internal:8086/v1. This service
  # is only a convenience alternative, gated behind the `llama` profile so the core
  # stack still boots fully offline (default provider is mock).
  # Start it with:  docker compose --profile llama up llama
  # Then override AEGIS_PROVIDER_LOCAL_BASE_URL / _EGRESS_ALLOWLIST to http://llama:8086/v1.
  # PLACEHOLDER IMAGE — confirm/replace before use: `:server` is the upstream CPU
  # build; for GPU pick the matching build (e.g. `:server-cuda`) and pin a specific
  # tag+digest for reproducibility like the other services. The user's real setup is
  # an AMD ROCm host binary, not this image. Place your GGUF under ./models and set
  # LLAMA_GGUF to its container path.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ['llama']
    command:
      - '-m'
      - '${LLAMA_GGUF:-/models/model.gguf}'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8086'
      - '--alias'
      - '${AEGIS_PROVIDER_LOCAL_MODEL:-local-model}'
    volumes:
      - ./models:/models:ro
    ports:
      - '${LLAMA_PORT:-8086}:8086'
    healthcheck:
      # llama-server returns 200 on /health once the model is loaded. If the
      # chosen image lacks curl, switch this to a wget-based probe.
      test: ['CMD', 'curl', '-f', 'http://localhost:8086/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.1
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aegis_dev
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres_data:
  minio_data:
  tempo_data:
  prometheus_data:
  grafana_data:
