# Application containers use a read-only root filesystem. Their only expected
# writable path is the bounded transient /tmp tmpfs declared below. Stateful
# and observability services retain their writable data volumes and defaults so
# the local development stack remains compatible with their upstream images.
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aegis}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aegis_dev_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
      AEGIS_HEALTH_PROBE_TIMEOUT_MS: ${AEGIS_HEALTH_PROBE_TIMEOUT_MS:-2000}
      AEGIS_READY_REQUIRE_REDIS: ${AEGIS_READY_REQUIRE_REDIS:-true}
      AEGIS_READY_REQUIRE_OBJECT_STORAGE: ${AEGIS_READY_REQUIRE_OBJECT_STORAGE:-true}
      # Local LLM wiring. Default provider stays offline (mock); set
      # AEGIS_PROVIDER_DEFAULT=local and start the `llama` profile to use it.
      AEGIS_PROVIDER_LOCAL_BASE_URL: ${AEGIS_PROVIDER_LOCAL_BASE_URL:-http://llama:8080/v1}
      AEGIS_PROVIDER_EGRESS_ALLOWLIST: ${AEGIS_PROVIDER_EGRESS_ALLOWLIST:-https://api.openai.com/v1,http://llama:8080/v1}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOSTNAME: '0.0.0.0'
      WEB_PORT: 3000
      NEXT_PUBLIC_AEGIS_DATA_SOURCE: api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/v1/realtime
      NEXT_PUBLIC_AEGIS_WS_TOKEN: ${NEXT_PUBLIC_AEGIS_WS_TOKEN:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      AEGIS_WORKER_MODE: outbox-relay
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
      # Local LLM wiring (offline by default; see the api service note above).
      AEGIS_PROVIDER_LOCAL_BASE_URL: ${AEGIS_PROVIDER_LOCAL_BASE_URL:-http://llama:8080/v1}
      AEGIS_PROVIDER_EGRESS_ALLOWLIST: ${AEGIS_PROVIDER_EGRESS_ALLOWLIST:-https://api.openai.com/v1,http://llama:8080/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: services/simulation/Dockerfile
    command: ['aegis-simulator', 'service']
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AEGIS_ENV: development
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aegis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aegis_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-aegis-artifacts}
      API_PORT: 8000
      WEB_PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: aegis-simulator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      AEGIS_LOG_JSON: ${AEGIS_LOG_JSON:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Local LLM: llama.cpp llama-server exposing an OpenAI-compatible API on :8080.
  # Gated behind the `llama` profile so the core stack still boots fully offline
  # (default provider is mock) without requiring a downloaded GGUF model.
  # Start it with:  docker compose --profile llama up llama
  # NOTE FOR USER: confirm the image tag before relying on this. `:server` is the
  # CPU build; for GPU use `:server-cuda`. Pin a specific build (e.g.
  # `:server--b4735`) for reproducibility like the other services. Place your
  # GGUF under ./models and set LLAMA_GGUF to its container path.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ['llama']
    command:
      - '-m'
      - '${LLAMA_GGUF:-/models/model.gguf}'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - '${AEGIS_PROVIDER_LOCAL_MODEL:-local-model}'
    volumes:
      - ./models:/models:ro
    ports:
      - '${LLAMA_PORT:-8080}:8080'
    healthcheck:
      # llama-server returns 200 on /health once the model is loaded. If the
      # chosen image lacks curl, switch this to a wget-based probe.
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.1
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aegis_dev
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres_data:
  minio_data:
  tempo_data:
  prometheus_data:
  grafana_data:
