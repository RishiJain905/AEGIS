name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e1ed6aa # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: pnpm audit signatures

  static-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e1ed6aa # v4.2.2
      - uses: astral-sh/setup-uv@38f38f5abc3a7d66f76565e827fe947f838cf667 # v5.4.2
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-packages --all-packages
      - run: uv run ruff check .
      - run: pnpm typecheck:py
      - run: uv run pytest -q
      - run: uv run pip-audit

  boundaries:
    runs-on: ubuntu-latest
    needs: [static-js, static-py]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e1ed6aa # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@38f38f5abc3a7d66f76565e827fe947f838cf667 # v5.4.2
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-packages
      - run: pnpm boundaries
      - run: uv run lint-imports

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e1ed6aa # v4.2.2
      - run: docker compose config
      - run: docker compose build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e1ed6aa # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
